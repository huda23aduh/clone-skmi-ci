version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-clone-skmi
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: digital_storage
      MYSQL_USER: storage_user
      MYSQL_PASSWORD: storage_password
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local